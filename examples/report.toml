cache_max_age = 900          # Seconds; set to 0 to revalidate every request.
title = "Development update"
footline_left = "Core team"

[repositories.acts]
truncate_pr_titles = true
do_reviewers = true
forge = "github"
name = "acts-project/acts"
display_name = "ACTS"

[repositories.acts.frame_titles]
merged_prs = "Merged in {category}"

[[sections]]
type = "statistics"
repositories = ["acts"]

[sections.labels]
exclude = ["backport"]

[[sections]]
type = "changes"
repositories = ["acts"]
state = "merged"
group_by = "category"
summary = false         # The statistics section above already shows the summary.

[sections.labels]
exclude = ["backport"]

[[sections]]
type = "changes"
repositories = ["acts"]
state = "open"
drafts = "include"

