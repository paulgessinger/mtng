on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python:
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@v4
      - name: Install texlive
        run: >
          sudo apt-get update
          && sudo apt-get install -y texlive texlive-latex-recommended texlive-latex-extra latexmk
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "${{ matrix.python }}"
      - name: Run tests
        run: uv run --group dev pytest -m "not integration" -n auto

  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Render reports from checked-in fixtures
        run: uv run --group dev python tests/render_fixtures.py
      - uses: actions/upload-artifact@v4
        with:
          name: latex-src
          path: "*.tex"

  compile:
    runs-on: ubuntu-latest
    needs: generate
    steps:
      - name: Install LaTeX
        run: >
          sudo apt-get update
          && sudo apt-get install -y texlive texlive-latex-recommended texlive-latex-extra latexmk
      - uses: actions/download-artifact@v4
        with:
          name: latex-src
      - name: Compile full latex
        run: latexmk -pdf -output-directory=full full.tex
      - name: Compile fragment latex
        run: |
          {
            printf '%s\n' '\documentclass{beamer}' '\begin{document}'
            cat fragment.tex
            printf '%s\n' '\end{document}'
          } > combined.tex
          latexmk -pdf -output-directory=combined combined.tex
      - uses: actions/upload-artifact@v4
        with:
          name: latex-pdf
          path: |
            full/*.pdf
            combined/*.pdf

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Run black
        run: uv run --group dev black --check .
