on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python:
          - "3.12"
          - "3.13"
          - "3.14"
    env:
      # The live GitHub integration test is intentionally exercised once to avoid
      # exhausting the shared installation rate limit across the full matrix.
      GH_TOKEN: ${{ matrix.python == '3.12' && secrets.GITHUB_TOKEN || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install texlive
        run: >
          sudo apt-get update
          && sudo apt-get install -y texlive texlive-latex-recommended texlive-latex-extra latexmk
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "${{ matrix.python }}"
      - name: Run tests
        run: uv run --group dev pytest -m "not integration" -n auto

  integration:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Run integration tests
        run: uv run --group dev pytest -m integration -n 1

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Configured entirely through inputs, the way a project that does not want
      # to check in a config file would use it.
      - name: Summarize a period from inputs
        uses: ./
        with:
          repository: acts-project/acts
          since: 2022-08-01
          now: 2022-08-17
          title: ACTS since {since}
          stale_label: Stale
          do_recent_issues: "true"
          group_prs_by_category: "true"
          output: from-inputs.pdf
          tex: from-inputs.tex
      # Same action, driven by a checked-in config file. LaTeX is already
      # installed by the step above.
      - name: Summarize a period from a config file
        uses: ./
        with:
          config: tests/acts_spec.yml
          since: 2022-08-01
          now: 2022-08-17
          output: pdf/from-config.pdf
          install-latex: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: action-pdf
          path: |
            from-inputs.pdf
            pdf/from-config.pdf

  generate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Generate tex output
        run: >
          uv run mtng generate tests/acts_spec.yml --since 2022-08-01 --now 2022-08-17 --tex fragment.tex
          && uv run mtng generate tests/acts_spec.yml --since 2022-08-01 --now 2022-08-17 --full --tex full.tex
      - uses: actions/upload-artifact@v4
        with:
          name: latex-src
          path: "*.tex"

  compile:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest-small
    needs: generate
    steps:
      - run: tlmgr install latexmk && ln -s /usr/local/texlive/20*/bin/*/latexmk /usr/local/bin/latexmk
      - uses: actions/download-artifact@v4
        with:
          name: latex-src
      - name: Compile full latex
        run: latexmk -pdf -output-directory=full full.tex
      - name: Compile fragment latex
        run: >
          printf "\\documentclass{beamer}\n\\\begin{document}\n" >> combined.tex
          && cat fragment.tex >> combined.tex
          && printf "\\\\end{document}" >> combined.tex
          && latexmk -pdf -output-directory=combined combined.tex
      - uses: actions/upload-artifact@v4
        with:
          name: latex-pdf
          path: |
            full/*.pdf
            combined/*.pdf

  black:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Run black
        run: uv run --group dev black --check .
