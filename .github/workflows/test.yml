on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python:
          - "3.12"
          - "3.13"
          - "3.14"
    env:
      # The live GitHub integration test is intentionally exercised once to avoid
      # exhausting the shared installation rate limit across the full matrix.
      GH_TOKEN: ${{ matrix.python == '3.12' && secrets.GITHUB_TOKEN || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install texlive
        run: >
          sudo apt-get update
          && sudo apt-get install -y texlive texlive-latex-recommended texlive-latex-extra latexmk
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "${{ matrix.python }}"
      - name: Run tests
        run: uv run --group dev pytest -m "not integration" -n auto

  integration:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"
      - name: Run integration tests
        run: uv run --group dev pytest -m integration -n 1

  generate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"
      - name: Generate tex output
        run: >
          uv run mtng generate tests/acts_spec.yml --since 2022-08-01 --now 2022-08-17 --tex fragment.tex
          && uv run mtng generate tests/acts_spec.yml --since 2022-08-01 --now 2022-08-17 --full --tex full.tex
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: latex-src
          path: "*.tex"

  compile:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest-small
    needs: generate
    steps:
      # The container's default CTAN mirror is unreliable; point tlmgr at
      # mirror.ctan.org, which redirects to a live mirror.
      - run: >
          tlmgr option repository https://mirror.ctan.org/systems/texlive/tlnet
          && tlmgr install latexmk
          && ln -s /usr/local/texlive/20*/bin/*/latexmk /usr/local/bin/latexmk
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: latex-src
      - name: Compile full latex
        run: latexmk -pdf -output-directory=full full.tex
      - name: Compile fragment latex
        run: >
          printf "\\documentclass{beamer}\n\\\begin{document}\n" >> combined.tex
          && cat fragment.tex >> combined.tex
          && printf "\\\\end{document}" >> combined.tex
          && latexmk -pdf -output-directory=combined combined.tex
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: latex-pdf
          path: |
            full/*.pdf
            combined/*.pdf

  # Replaces the previous standalone `black` job: prek runs black plus the
  # file-hygiene hooks and zizmor, all from .pre-commit-config.yaml.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: j178/prek-action@5337cb91e0fa35a7ff31b9ca345126d8bbbcdf16 # v2.0.6
        with:
          prek-version: '0.3.x'
