on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python:
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install texlive
        run: >
          sudo apt-get update
          && sudo apt-get install -y texlive texlive-latex-recommended texlive-latex-extra latexmk
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "${{ matrix.python }}"
      - name: Run tests
        run: uv run --group dev pytest -m "not integration" -n auto

  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"
      - name: Render reports from checked-in fixtures
        run: uv run --group dev python tests/render_fixtures.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: latex-src
          path: "*.tex"

  compile:
    runs-on: ubuntu-latest
    needs: generate
    steps:
      - name: Install LaTeX
        run: >
          sudo apt-get update
          && sudo apt-get install -y texlive texlive-latex-recommended texlive-latex-extra latexmk
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: latex-src
      - name: Compile full latex
        run: latexmk -pdf -output-directory=full full.tex
      - name: Compile fragment latex
        run: |
          {
            printf '%s\n' '\documentclass{beamer}' '\begin{document}'
            cat fragment.tex
            printf '%s\n' '\end{document}'
          } > combined.tex
          latexmk -pdf -output-directory=combined combined.tex
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: latex-pdf
          path: |
            full/*.pdf
            combined/*.pdf

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: j178/prek-action@5337cb91e0fa35a7ff31b9ca345126d8bbbcdf16 # v2.0.6
        with:
          prek-version: '0.3.x'
