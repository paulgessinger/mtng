name: Live API smoke test
on:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: live-api-smoke
  cancel-in-progress: false
jobs:
  github:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"
      - name: Check the GitHub API contract (at most three requests)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MTNG_GITHUB_TEST_PROJECT: ${{ github.repository }}
        run: uv run --group dev pytest tests/test_live_github.py -m integration -n 1
