name: Live API smoke test
on:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: live-api-smoke
  cancel-in-progress: false
jobs:
  github:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version: "3.12"
      - name: Check the GitHub API contract (at most three requests)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MTNG_GITHUB_TEST_PROJECT: ${{ github.repository }}
        run: uv run --group dev pytest tests/test_live_github.py -m integration -n 1
