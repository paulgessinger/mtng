[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "mtng"
dynamic = ["version"]
description = ""
authors = [
    { name = "Paul Gessinger", email = "hello@paulgessinger.com" }
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Jinja2>=3.1.1",
    "requests>=2.25.1",
    "typer>=0.6.1",
    "python-dateutil>=2.8.1",
    "dateparser>=1.2.2",
    "aiohttp>=3.7.4",
    "gidgethub>=5.0.1",
    "pydantic>=2",
    "PyYAML>=6.0.1",
    "pytest-asyncio>=0.19.0",
    "appdirs>=1.4.4",
    "diskcache>=5.4.0",
    "rich>=13.4.2",
    "keyring>=25.6.0",
]

[project.scripts]
mtng = "mtng.cli:cli"

[project.urls]
homepage = "https://github.com/paulgessinger/mtng"

[dependency-groups]
dev = [
    "black>=25.9.0",
    "nox>=2025.5.1",
    "pytest>=8.4.2",
    "pytest-sugar>=1.1.1",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: tests that call external services",
]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["src/mtng"]

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
