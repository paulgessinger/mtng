[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "mtng"
dynamic = ["version"]
description = ""
authors = [
    { name = "Paul Gessinger", email = "hello@paulgessinger.com" }
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Jinja2>=3.1.1",
    "requests>=2.34.2",
    "typer>=0.27.3",
    "python-dateutil>=2.8.1",
    "dateparser>=1.4.3",
    "aiohttp>=3.14.4",
    "gidgethub>=6.0.0",
    "pydantic>=2.13.5",
    "PyYAML>=6.0.1",
    "pytest-asyncio>=1.4.0",
    "appdirs>=1.4.4",
    "diskcache>=5.4.0",
    "rich>=15.0.0",
    "keyring>=25.6.0",
    "humanize>=4.16.0",
]

[project.scripts]
mtng = "mtng.cli:cli"

[project.urls]
homepage = "https://github.com/paulgessinger/mtng"

[dependency-groups]
dev = [
    "black>=26.10.0",
    "nox>=2026.8.17",
    "pytest>=9.1.1",
    "pytest-sugar>=1.1.1",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
markers = [
    "integration: tests that call external services",
]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["src/mtng"]

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
